<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEYFLOW — Piano Studio</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<aside id="nav"></aside>
<main>
  <div id="view"></div>
  <section class="dock">
    <div class="controls">
      <button id="octDown" title="Octave down (Z)">Oct −</button>
      <span id="octLabel">C4</span>
      <button id="octUp" title="Octave up (X)">Oct +</button>
      <button id="sustain" title="Sustain (Space)">Sustain</button>
      <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01"></label>
    </div>
    <div class="pianowrap"><div id="piano"></div></div>
  </section>
</main>
<div id="toast"></div>
<script src="data/songs.js"></script>
<script src="data/lessons.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/piano.js"></script>
<script src="js/games.js"></script>
<script src="script.js"></script>
</body></html>
